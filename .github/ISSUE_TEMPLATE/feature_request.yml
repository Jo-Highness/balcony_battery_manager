name: Feature request
description: Suggest an idea or improvement for the integration
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Please describe the problem you
        are trying to solve so we can find the best solution together.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: >
        Is your feature request related to a problem? A clear and concise
        description of what the problem is (e.g. "I'm frustrated when ...").
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Desired solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or features you have considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: >
        Any other context, hardware details, or screenshots about the feature
        request.
    validations:
      required: false
